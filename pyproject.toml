[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notearsforge"
version = "0.1.0"
description = "World-class causal-discovery toolkit (GES / PC / NOTEARS) with deterministic benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = [
    "causal-discovery",
    "causal-inference",
    "DAG",
    "GES",
    "PC-algorithm",
    "NOTEARS",
    "structure-learning",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "causal*", "eval*", "pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments (allowed for clarity in algo code)
    "PLR0912",  # too many branches (algorithm control flow is inherently branchy)
    "PLR0917",  # too many positional arguments (estimator constructors expose knobs)
    "PLR2004",  # magic value comparison
    "PLW0603",  # intentional module-level seed state in core.seed
    "PLC0415",  # lazy imports inside factory/example functions (avoid circular imports)
    "UP006",   # keep typing.List etc. for py3.11 compat where used
    "UP035",   # import from collections.abc
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415", "RUF059", "F401"]

[tool.ruff.lint.mccabe]
max-complexity = 40
